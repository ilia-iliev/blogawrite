[package]
name = "blogawrite"
version = "0.1.5"
edition = "2024"

[dependencies]
cxx = "1"
cxx-qt = "0.7"
cxx-qt-lib = { version = "0.7", features = ["qt_full"] }
pulldown-cmark = "0.13.4"

[build-dependencies]
cxx-qt-build = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
